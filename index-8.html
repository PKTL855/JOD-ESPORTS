<style>
/* Layout: sticky header (logo, account, scrollable tabs); one centred column of cards; slot lobby as a 12-tile grid. */
:root{
  color-scheme:dark;
  --bg:#0c0a1f; --surface:#171433; --surface-2:#211d45; --line:#35305f;
  --fg:#f4f1ff; --muted:#aaa5d4;
  --accent:#ffc83d; --accent-ink:#1c1303;
  --open:#35d6ff; --magenta:#ff4fa3; --violet:#9a6bff;
  --danger:#ff7b8f; --ok:#4fe3a3; --taken:#3d3868;
  --grad:linear-gradient(135deg,#ffd84a,#ff8a3d);
  --grad-wild:linear-gradient(90deg,#ff4fa3,#9a6bff 45%,#35d6ff);
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(60rem 40rem at 8% -8%,rgba(154,107,255,.30),transparent 60%),radial-gradient(50rem 36rem at 100% 0%,rgba(255,79,163,.22),transparent 55%),radial-gradient(46rem 34rem at 50% 108%,rgba(53,214,255,.20),transparent 60%);background-attachment:fixed;color:var(--fg);font:15px/1.5 var(--body)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;background:rgba(12,10,31,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:2px solid transparent;border-image:var(--grad-wild) 1;padding-top:env(safe-area-inset-top,0px)}
.bar1{display:flex;align-items:center;gap:12px;padding-top:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0;flex:1}
.logo-sm{width:42px;height:42px;border-radius:10px;flex:0 0 auto;box-shadow:0 0 0 1px var(--line),0 0 18px rgba(255,200,61,.35)}
h1{font:700 26px/1 var(--display);letter-spacing:.04em;margin:0;text-transform:uppercase;white-space:nowrap}
h1 .x{color:var(--magenta)}
#authbox{display:flex;align-items:center;gap:8px;min-width:0}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.me-n{font-size:13px;font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:10px 12px;color:var(--muted);text-decoration:none;font:600 19px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--tc,var(--accent))}
.tabs a[data-tab="slots"]{--tc:var(--open)}
.tabs a[data-tab="vote"]{--tc:var(--magenta)}
.tabs a[data-tab="organizer"]{--tc:var(--violet)}
.tabs a[data-tab="points"]{--tc:var(--ok)}
:focus-visible{outline:2px solid var(--open);outline-offset:2px}
.main{padding-block:18px 48px}
#notices{display:flex;flex-direction:column;gap:10px}
#notices:not(:empty){margin-bottom:16px}
[data-panel]{display:none;flex-direction:column;gap:16px}
[data-panel].on{display:flex}
#org-settings:empty,#org-data:empty{display:none}
#org-data{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.locked{opacity:.55}
h2{font:700 24px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.hero{display:flex;align-items:center;gap:18px;padding:20px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(255,79,163,.18),rgba(154,107,255,.16) 50%,rgba(53,214,255,.16));min-width:0}
.hero .logo-lg{width:116px;height:116px;flex:0 0 auto;border-radius:16px;box-shadow:0 0 0 1px rgba(255,200,61,.5),0 0 36px rgba(255,200,61,.35)}
.hero-t{min-width:0;display:flex;flex-direction:column;gap:10px}
.tag{font:600 13px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.big{font:700 42px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;background:var(--grad-wild);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.stat b{display:block;font:700 40px/1 var(--display);color:var(--c,var(--accent));font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.how{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.how li{display:flex;gap:12px;align-items:flex-start}
.how li div{min-width:0;display:flex;flex-direction:column;gap:2px}
.how li b{font:700 19px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.step{display:inline-grid;place-items:center;width:30px;height:30px;flex:0 0 auto;border-radius:7px;background:var(--grad);color:var(--accent-ink);font:700 18px/1 var(--display)}
.step.done{background:var(--ok)}
.gate-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.gate-row .who{flex:1 1 140px;min-width:0;font:600 15px/1.2 var(--mono);overflow-wrap:anywhere}
.tick{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.tick input{width:20px;height:20px;accent-color:var(--accent)}
.btn{appearance:none;border:0;background:var(--grad);color:var(--accent-ink);font:700 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:12px 18px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.wa{background:#25d366;color:#04210f}
.btn.sm{font-size:15px;padding:8px 12px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
fieldset{border:0;margin:0;padding:0;min-width:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.lbl{font:600 12px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=time],input[type=number],input[type=date],select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:500 16px/1.2 var(--body)}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin-bottom:8px}
.logo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file-hide{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{appearance:none;width:42px;height:42px;display:grid;place-items:center;border-radius:9px;background:var(--bg);color:var(--fg);border:1px solid var(--line);cursor:pointer;padding:0}
.pick svg{width:22px;height:22px}
.pick[aria-pressed="true"]{border:2px solid var(--accent);color:var(--accent)}
.sw{appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.av{display:inline-grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font:700 20px/1 var(--display);color:var(--accent);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av svg{display:block}
.av.lg{width:64px;height:64px;font-size:30px;border-radius:12px}
.av.sm{width:28px;height:28px;font-size:15px;border-radius:7px}
.team-head{display:flex;align-items:center;gap:14px;min-width:0}
.team-head>div{min-width:0}
.team-name{font:700 28px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;flex:1 1 150px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:600 18px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--accent-ink);background:var(--grad);border-color:transparent}
.session{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.count{font:600 14px/1 var(--mono)}
.meter{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:180px;max-width:100%}
.meter i{height:8px;border-radius:2px;background:var(--taken)}
.meter i.f{background:var(--grad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{--c:var(--open);appearance:none;text-align:left;background:var(--surface);color:var(--fg);border:1px dashed var(--c);border-radius:10px;padding:10px;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer;min-width:0;font:inherit}
.tile .n{font:600 26px/1 var(--mono);color:var(--c)}
.tile .s{font:600 12px/1.2 var(--mono);letter-spacing:.08em;color:var(--c)}
.tile.taken{border:1px solid var(--line);background:var(--surface-2);cursor:default}
.tile.taken .n{color:var(--muted)}
.tile.mine{border:0;background:var(--grad);color:var(--accent-ink);cursor:default}
.tile.mine .n{color:var(--accent-ink)}
.tile:disabled:not(.taken):not(.mine){opacity:.6;cursor:not-allowed}
.tile .who{display:flex;align-items:center;gap:6px;min-width:0}
.tile .trow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile .who .nm{font-size:12px;font-weight:600;line-height:1.2;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.lock{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);letter-spacing:.06em;padding:6px 9px;border-radius:6px;margin-top:8px}
.lock.on{background:rgba(79,227,163,.14);color:var(--ok)}
.lock.off{background:rgba(255,123,143,.14);color:var(--danger)}
.lockrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.info{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.info-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:600 13px/1 var(--mono);padding:7px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.pill.fee{color:var(--accent);border-color:var(--accent)}
.prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prize{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.prize span{font-size:12px;color:var(--muted)}
.prize b{font:700 22px/1.1 var(--display);color:#ffd84a;overflow-wrap:anywhere}
.prize:nth-child(2) b{color:#d9def0}
.prize:nth-child(3) b{color:#e8a66d}
.chip.wait{background:rgba(255,200,61,.16);color:var(--accent)}
.chip.okc{background:rgba(79,227,163,.16);color:var(--ok)}
.tile.sel{outline:2px solid var(--fg);outline-offset:2px}
.pay{border-color:var(--accent)}
.pay .qr{width:230px;max-width:100%;border-radius:12px;background:#fff;padding:8px;display:block;margin:8px 0}
.paysteps{margin:6px 0 12px;padding-left:20px;color:var(--muted);font-size:14px}
.paysteps li{margin:3px 0}
.upi{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.upi .mono{font-size:15px;overflow-wrap:anywhere}
.payrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.payrow:first-child{border-top:0}
.payrow .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qrprev{width:140px;border-radius:10px;background:#fff;padding:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{appearance:none;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:600 13px/1 var(--mono);letter-spacing:.04em;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--grad);color:var(--accent-ink);border-color:transparent}
.chips button:disabled{opacity:.5;cursor:not-allowed}
table.lb{min-width:0;table-layout:fixed}
.lb th,.lb td{padding:8px 5px}
.lb th.r,.lb td.num{text-align:right}
.lb .tm{display:flex;align-items:center;gap:8px;min-width:0}
.lb .tn{min-width:0;font-weight:600;font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.lb td.num{font:600 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.lb td.tot{font:700 24px/1 var(--display);color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
.lb tr.top3 td{background:rgba(255,200,61,.06)}
.rk{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:7px;font:700 14px/1 var(--mono);color:var(--muted);flex:0 0 auto}
.rk.r1{background:#ffd84a;color:#1c1303}
.rk.r2{background:#d9def0;color:#1c1303}
.rk.r3{background:#e8a66d;color:#1c1303}
.ptphoto{width:100%;max-width:420px;border-radius:12px;border:1px solid var(--line);display:block;margin-top:12px}
.perow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.perow .nm{flex:1 1 120px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.perow .ctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.perow select{width:112px;padding:10px 8px}
.perow input{width:78px}
.perow .pts{font:600 14px/1 var(--mono);min-width:58px;text-align:right;color:var(--accent)}
.lead{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lead>div{display:flex;align-items:center;gap:10px;min-width:0}
.lead .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input{flex:1 1 180px;width:auto}
.chip{flex:0 0 auto;font:600 11px/1 var(--mono);letter-spacing:.06em;padding:4px 6px;border-radius:5px;background:var(--accent-ink);color:var(--accent)}
.mybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;padding:12px 14px}
.roster{list-style:none;margin:0;padding:0}
.roster li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.roster li:first-child{border-top:0}
.roster .no{font:600 15px/1 var(--mono);width:26px;color:var(--accent)}
.roster .nm{flex:1;min-width:0;overflow-wrap:break-word;font-weight:500}
.roster .btn{flex:0 0 auto}
.conf{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.conf.first{border-top:0;padding-top:0}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:500 13px/1.5 var(--mono)}
.votes{display:grid;gap:10px}
.vote{--c:var(--accent);appearance:none;position:relative;overflow:hidden;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font:inherit}
.vote .fill{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.25;width:0}
.vote>*:not(.fill){position:relative}
.vote .vl{font:700 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--c);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vote .pc{font:600 16px/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.vote .pc small{display:block;margin-top:4px;color:var(--muted);font:500 12px/1 var(--mono)}
.vote.mine{border-color:var(--c)}
.vote:disabled{cursor:not-allowed}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font:600 12px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
td.mono{font-size:13px;font-variant-numeric:tabular-nums}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);border-radius:9px;padding:12px 14px;font-size:14px}
.note.warn{border-left-color:var(--danger)}
.note.info{border-left-color:var(--open)}
.note a{color:var(--open)}
.note .btn{margin-top:8px}
.switch{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;width:max-content;max-width:min(92vw,460px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:9px;font-weight:500;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#toast.warn{background:var(--danger);color:#240808}
footer{padding-block:0 32px;color:var(--muted);font-size:12px}
footer a{color:var(--muted)}
@media (max-width:520px){
  .fields{grid-template-columns:minmax(0,1fr)}
  .me{display:none}
  h1{font-size:20px}
  #authbox .btn.sm{font-size:14px;padding:7px 10px}
  .hero{flex-direction:column;align-items:flex-start;gap:14px;padding:16px}
  .hero .logo-lg{width:84px;height:84px}
  .big{font-size:32px}
  .tabs a{font-size:17px;padding:10px 10px}
  .stat b{font-size:34px}
}
@media (prefers-reduced-motion:no-preference){.vote .fill{transition:width .4s ease}}

const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const svg = inner => '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + inner + "</svg>";
let toastTimer = null;
function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg; t.className = kind || ""; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 4800);
}
function errMsg(e, fallback) {
  const c = (e && e.code) || "";
  if (c === "auth/unauthorized-domain") return "This website address is not allowed yet. Organizer: add it in Firebase > Authentication > Settings > Authorized domains.";
  if (c === "auth/network-request-failed" || c === "unavailable") return "No internet connection. Try again.";
  if (IN_APP && c.startsWith("auth/")) return "Open this page in Chrome or Safari to sign in.";
  return fallback || "Something went wrong. Try again.";
}
function onErr(e) {
  console.error(e);
  if (S.errShown) return;
  S.errShown = true;
  toast(errMsg(e, "Live data could not load. Reload the page."), "warn");
}
function cleanHandle(v) {
  return String(v || "").trim()
    .replace(/^https?:\/\/(www\.)?instagram\.com\//i, "")
    .replace(/^@/, "").replace(/[\/?#].*$/, "")
    .replace(/[^A-Za-z0-9._]/g, "").slice(0, 30);
}
function parseMobile(v) {
  const d = String(v || "").replace(/[^\d+]/g, "").replace(/^\+?91(?=\d{10}$)/, "").replace(/^0(?=\d{10}$)/, "");
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}
function normSettings(s) {
  const o = { ...DEFAULTS, ...(s || {}) };
  const hs = Array.isArray(o.handles) ? o.handles.map(cleanHandle) : DEFAULTS.handles.slice();
  while (hs.length < 3) hs.push("");
  o.handles = hs.slice(0, 3);
  if (!/^\d{2}:\d{2}$/.test(o.scrimTime || "")) o.scrimTime = DEFAULTS.scrimTime;
  o.scrimOpen = o.scrimOpen !== false;
  o.practiceOpen = o.practiceOpen !== false;
  const lb = o.lobbies && typeof o.lobbies === "object" ? o.lobbies : {};
  o.lobbies = {};
  for (const k of Object.keys(MODES)) o.lobbies[k] = normLobby(lb[k]);
  o.upiId = String(o.upiId || "").trim();
  o.upiName = String(o.upiName || "").trim();
  o.qr = typeof o.qr === "string" && o.qr.startsWith("data:image/") ? o.qr : "";
  o.pointsLive = /^pts_(scrim|practice)_\d{4}-\d{2}-\d{2}$/.test(o.pointsLive || "") ? o.pointsLive : "";
  return o;
}
function normLobby(l) {
  l = l || {};
  return {
    date: /^\d{4}-\d{2}-\d{2}$/.test(l.date || "") ? l.date : "",
    time: /^\d{2}:\d{2}$/.test(l.time || "") ? l.time : "",
    fee: Math.max(0, Math.min(100000, Math.floor(Number(l.fee) || 0))),
    p1: String(l.p1 || "").slice(0, 30), p2: String(l.p2 || "").slice(0, 30), p3: String(l.p3 || "").slice(0, 30)
  };
}
function lobby(mode) { return (S.settings && S.settings.lobbies && S.settings.lobbies[mode]) || normLobby(null); }

function copyText(ta, text) {
  const value = text != null ? text : ta.value;
  if (ta) { ta.focus(); ta.select(); }
  const fallback = () => toast(ta ? "Press and hold the text to copy it." : value);

}

/* ---------- time (all IST) ---------- */
function istNow() {
  const d = new Date();
  const date = d.toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
  const t = d.toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour12: false });
  return { date, mins: parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3, 5), 10) };
}
function addDay(date) {
  return new Date(Date.parse(date + "T12:00:00+05:30") + 864e5).toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
}
function scrimMins() { const [a, b] = (lobby("scrim").time || S.settings.scrimTime).split(":").map(Number); return a * 60 + b; }
function dayKey(mode) {
  const L = lobby(mode);
  if (L.date) return L.date;
  if (mode === "practice") return "open";
  const n = istNow();
  return n.mins < scrimMins() ? n.date : addDay(n.date);
}
function fmtTime(hhmm) {
  const [a, b] = hhmm.split(":").map(Number);
  return (((a + 11) % 12) + 1) + ":" + String(b).padStart(2, "0") + " " + (a >= 12 ? "PM" : "AM");
}
function dayLabel(key) {
  return new Date(key + "T12:00:00+05:30").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", timeZone: "Asia/Kolkata" });
}
function sessionLabel(mode) {
  const L = lobby(mode);
  if (L.date) return dayLabel(L.date) + (L.time ? " · " + fmtTime(L.time) : "");
  if (mode === "scrim") return dayLabel(dayKey("scrim")) + " · " + fmtTime(L.time || S.settings.scrimTime);
  return "Open practice lobby" + (L.time ? " · " + fmtTime(L.time) : "");
}
function currentDays() { return [...new Set(Object.keys(MODES).map(dayKey))]; }

/* ---------- logos ---------- */
function applyPreset(el, str) {
  const m = /^([a-z]+)\|(#[0-9a-fA-F]{6})$/.exec(String(str || ""));
  if (!m || !ICONS[m[1]]) return false;
  el.style.background = m[2];
  el.style.color = "#0c0a1f";
  el.innerHTML = '<svg viewBox="0 0 24 24" width="62%" height="62%" fill="currentColor" aria-hidden="true">' + ICONS[m[1]] + "</svg>";
  return true;
}
function avatar(t, size) {
  const letter = ((t && t.teamName) || "?").trim().charAt(0).toUpperCase() || "?";
  const el = h("span", { class: "av" + (size ? " " + size : "") });
  if (t && typeof t.logo === "string" && t.logo.startsWith("data:image/")) {
    const img = h("img", { src: t.logo, alt: "" });
    img.addEventListener("error", () => { img.remove(); el.textContent = letter; });
    el.append(img);
  } else if (!(t && applyPreset(el, t.preset))) el.textContent = letter;
  return el;
}
function resizeLogo(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const size = 128, cv = document.createElement("canvas");
      cv.width = cv.height = size;
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      cv.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let out = cv.toDataURL("image/webp", 0.82);
      if (!out.startsWith("data:image/webp")) out = cv.toDataURL("image/jpeg", 0.82);
      out.length < 60000 ? resolve(out) : reject(new Error("too big"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

function slotMap(mode) {
  const day = dayKey(mode), m = {};
  for (const s of S.slots) if (s.mode === mode && s.day === day && s.n >= 1 && s.n <= SLOTS) m[s.n] = s;
  return m;
}
function slotOf(mode, uid) {
  if (!uid) return 0;
  const m = slotMap(mode);
  for (const n in m) if (m[n].uid === uid) return Number(n);
  return 0;
}
function myPayment(mode) {
  const day = dayKey(mode);
  return S.myPayments.find(x => x.mode === mode && x.day === day) || null;
}
function bookingText(mode, n) {
  const t = S.myTeam, L = lobby(mode), pay = myPayment(mode);
  const s = slotMap(mode)[n], pending = s && s.status === "pending";
  return [
    pending ? "JOD x ESPORTS · SLOT REQUEST (payment check pending)" : "JOD x ESPORTS · SLOT BOOKED",
    "Team: " + t.teamName,
    "Lobby: " + MODES[mode],
    mode === "scrim" || L.date || L.time ? "When: " + sessionLabel(mode) : null,
    "Slot: " + String(n).padStart(2, "0") + " of " + SLOTS,
    L.fee ? "Entry fee: " + rupee(L.fee) + (pay ? " · UTR " + pay.utr : "") : null,
    "IGL: " + t.iglName + " (ID " + t.iglId + ")",
    "Mobile: +91 " + t.mobile
  ].filter(Boolean).join("\n");
}

/* ---------- routing ---------- */
const PANELS = ["home", "register", "slots", "points", "vote", "organizer"];
function route() {
  let name = (location.hash || "#home").slice(1);
  if (!PANELS.includes(name) || (name === "organizer" && !S.admin)) name = "home";
  document.querySelectorAll("[data-panel]").forEach(p => p.classList.toggle("on", p.id === name));
  document.querySelectorAll("[data-tab]").forEach(a => {
    if (a.dataset.tab === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (name === "vote") refreshVotes(false);
}

async function book(mode, n) {
  if (!S.user || !S.myTeam || S.busy) return;
  if (!isOpen(mode)) { toast(MODES[mode] + " booking is closed right now.", "warn"); return; }
  const day = dayKey(mode), map = slotMap(mode);
  if (map[n] && map[n].uid !== S.user.uid) { toast("Slot " + n + " is already booked.", "warn"); return; }
  const prev = slotOf(mode, S.user.uid);
  if (prev === n) return;
  const L = lobby(mode);
  if (L.fee > 0) {
    if (prev) { toast("You already have slot " + pad2(prev) + ". Message the organizer if you need a different slot.", "warn"); return; }
    S.payFor = { mode, n }; S.payUtr = "";
    renderSlots();
    const pc = document.getElementById("paycard");
    if (pc) pc.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  S.busy = true; renderSlots();
  try {
    const t = S.myTeam;
    await S.api.book(S.user.uid, mode, day, n, prev, { teamName: t.teamName, logo: t.logo || null, preset: t.preset || null, status: "ok" }, null);
    toast("Slot " + n + " booked! Your booking message is below.");
  } catch (e) {
    toast(errMsg(e, !isOpen(mode) ? MODES[mode] + " booking just closed." : "Slot " + n + " was just taken by another team. Pick another slot."), "warn");
  } finally {
    S.busy = false; renderAll();
  }
}
async function payAndBook(err, btn) {
  const pf = S.payFor;
  if (!pf || !S.user || !S.myTeam || S.busy) return;
  const mode = pf.mode, n = pf.n, L = lobby(mode);
  err.textContent = "";
  if (!isOpen(mode)) { err.textContent = MODES[mode] + " booking is closed right now."; return; }
  const utr = String(S.payUtr || "").replace(/\s+/g, "");
  if (!/^[A-Za-z0-9]{6,40}$/.test(utr)) { err.textContent = "Enter the UPI transaction ID (UTR) from your payment app. It is usually 12 digits."; return; }
  if (slotMap(mode)[n]) { toast("Slot " + pad2(n) + " was just taken. Pick another slot.", "warn"); S.payFor = null; renderSlots(); return; }
  S.busy = true; btn.disabled = true;
  try {
    const t = S.myTeam;
    await S.api.book(S.user.uid, mode, dayKey(mode), n, 0,
      { teamName: t.teamName, logo: t.logo || null, preset: t.preset || null, status: "pending" },
      { utr, amount: L.fee, teamName: t.teamName });
    S.payFor = null; S.payUtr = "";
    toast("Slot " + pad2(n) + " is held for you. The organizer will confirm after checking your payment.");
  } catch (e) {
    toast(errMsg(e, !isOpen(mode) ? MODES[mode] + " booking just closed." : "Slot " + pad2(n) + " was just taken. Pick another slot."), "warn");
  } finally {
    S.busy = false; renderAll();
  }
}

function openEditor(mode, day) {
  if (!S.api || !S.admin) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(day || "")) day = ptDefaultDay(mode);
  const old = S.pe;
  if (old && old.unsub) old.unsub();
  const pe = S.pe = { mode, day, id: ptId(mode, day), data: undefined, unsub: null, sel: -1, rows: {}, rowsFor: "", err: "", busy: false, addName: old ? old.addName : "" };
  pe.unsub = S.api.watchDoc(pe.id, d => {
    if (S.pe !== pe) return;
    const first = pe.data === undefined;
    pe.data = normTable(d);
    if (pe.sel >= (pe.data ? pe.data.matches.length : 0)) pe.sel = -1;
    fillRows(false); renderPoints(!first);
  }, onErr);
  renderPoints();
}
function fillRows(force) {
  const pe = S.pe, tag = pe.id + ":" + pe.sel + ":" + (pe.data ? "y" : "n");
  if (!force && pe.rowsFor === tag) return;
  pe.rowsFor = tag; pe.rows = {};

function armPt(key) {

}
async function writeTable(tb) {
  const pe = S.pe;

    kind: "points", mode: pe.mode, day: pe.day, at: Date.now(),
    teams: tb.teams.map(t => ({ k: t.k, name: t.name, logo: t.logo || null, preset: t.preset || null, slot: t.slot || 0 })),
    matches: tb.matches.map(m => ({ r: m.r }))

}
async function peRun(fn, fallback) {
  const pe = S.pe;

  pe.busy = true; pe.err = ""; renderPoints();
  try { await fn(pe); }

}
function syncTeams() {
  return peRun(async pe => {
    const existed = !!pe.data;
    const days = pe.mode === "practice" ? [pe.day, "open"] : [pe.day];
    const all = (await S.api.getSlots(days)).filter(s => s.mode === pe.mode && s.uid);
    const exact = all.filter(s => s.day === pe.day);
    const src = (exact.length ? exact : all).sort((a, b) => a.n - b.n);
    const teams = pe.data ? pe.data.teams.map(t => ({ ...t })) : [];
    let added = 0;
    for (const s of src) {
      const row = { k: s.uid, name: String(s.teamName || "Team").slice(0, 24), logo: s.logo || null, preset: s.preset || null, slot: s.n };
      const cur = teams.find(t => t.k === s.uid);
      if (cur) Object.assign(cur, row);
      else if (teams.length < MAX_TEAMS) { teams.push(row); added++; }
    }
    await writeTable({ teams, matches: pe.data ? pe.data.matches : [] });
    toast(!existed ? "Points table started with " + teams.length + (teams.length === 1 ? " team." : " teams.") + (teams.length ? "" : " Add teams below.")
      : added ? added + (added === 1 ? " team" : " teams") + " added from the slot list." : "Teams are already up to date.");
  }, "Could not load the teams. Try again.");
}
function addPtTeam() {
  const pe = S.pe, name = String(pe.addName || "").trim().replace(/\s+/g, " ");
  if (name.length < 2 || name.length > 24) { pe.err = "Team name must be 2 to 24 letters."; return renderPoints(); }
  if (pe.data.teams.some(t => t.name.toLowerCase() === name.toLowerCase())) { pe.err = name + " is already in the table."; return renderPoints(); }
  if (pe.data.teams.length >= MAX_TEAMS) { pe.err = "A lobby has 12 teams at most."; return renderPoints(); }
  return peRun(async pe => {
    await writeTable({ teams: pe.data.teams.concat({ k: "x" + Date.now().toString(36), name, logo: null, preset: null, slot: 0 }), matches: pe.data.matches });
    pe.addName = ""; toast(name + " added.");

}

function saveMatch() {
  const pe = S.pe, tb = pe.data;

  const r = {}, seen = {};
  for (const t of tb.teams) {
    const row = pe.rows[t.k] || {}, p = parseInt(row.p, 10) || 0, ks = String(row.k == null ? "" : row.k).trim();
    const k = ks === "" ? 0 : Number(ks);
    if (!Number.isInteger(k) || k < 0 || k > 99) { pe.err = t.name + ": kills must be a number from 0 to 99."; return renderPoints(); }
    if (!p) {
      if (k > 0) { pe.err = t.name + " has kills but no position. Pick its position."; return renderPoints(); }
      continue;
    }
    if (seen[p]) { pe.err = seen[p] + " and " + t.name + " are both " + ORD(p) + ". Each position can be used only once."; return renderPoints(); }
    seen[p] = t.name; r[t.k] = { p, k };

    await writeTable({ teams: tb.teams, matches });

  }, "Could not save the match. Try again.");
}

function resizeQr(fileObj) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileObj), img = new Image();
    img.onload = () => {
      const max = 520, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
      const ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      let out = cv.toDataURL("image/png");
      if (out.length > 300000) out = cv.toDataURL("image/jpeg", 0.9);
      out.length < 700000 ? resolve(out) : reject(new Error("too big"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

/* ---------- backends ---------- */
async function firebaseBackend() {
  const [appMod, A, F] = await Promise.all([
    import(FIREBASE_SDK + "firebase-app.js"),
    import(FIREBASE_SDK + "firebase-auth.js"),
    import(FIREBASE_SDK + "firebase-firestore.js")
  ]);
  const app = appMod.initializeApp(CONFIG.firebase);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const provider = new A.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  A.getRedirectResult(auth).catch(e => toast(errMsg(e, "Sign-in did not finish. Try again."), "warn"));
  const toUser = u => u ? { uid: u.uid, name: u.displayName || "", email: u.email || "", photo: u.photoURL || "" } : null;
  const list = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const ref = (c, id) => F.doc(db, c, id);
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(toUser(u))),
    async signIn() {
      try { await A.signInWithPopup(auth, provider); }
      catch (e) {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return A.signInWithRedirect(auth, provider);
        if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
        throw e;
      }
    },
    signOut: () => A.signOut(auth),
    watchSettings: (cb, err) => F.onSnapshot(ref("settings", "main"), s => cb(s.exists() ? s.data() : null), err),
    watchMyTeam: (uid, cb, err) => F.onSnapshot(ref("teams", uid), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err),
    watchAllTeams: (cb, err) => F.onSnapshot(F.collection(db, "teams"), s => cb(list(s)), err),
    watchSlots: (days, cb, err) => F.onSnapshot(F.query(F.collection(db, "slots"), F.where("day", "in", days)), s => cb(list(s)), err),
    saveTeam: (uid, team) => F.setDoc(ref("teams", uid), team),
    async updateSlots(ids, data) {
      const b = F.writeBatch(db);
      ids.forEach(id => b.update(ref("slots", id), data));
      await b.commit();
    },
    watchPayments: (cb, err) => F.onSnapshot(F.collection(db, "payments"), s => cb(list(s)), err),
    watchMyPayments: (uid, cb, err) => F.onSnapshot(F.query(F.collection(db, "payments"), F.where("uid", "==", uid)), s => cb(list(s)), err),
    async book(uid, mode, day, n, prevN, show, pay) {
      const b = F.writeBatch(db);
      if (prevN) b.delete(ref("slots", mode + "_" + day + "_" + prevN));
      b.set(ref("claims", mode + "_" + day + "_" + uid), { uid, mode, day, n });
      b.set(ref("slots", mode + "_" + day + "_" + n), { uid, mode, day, n, teamName: show.teamName, logo: show.logo, preset: show.preset, status: pay ? "pending" : "ok", at: F.serverTimestamp() });
      if (pay) b.set(ref("payments", mode + "_" + day + "_" + uid), { uid, mode, day, n, utr: pay.utr, amount: pay.amount, teamName: pay.teamName, at: F.serverTimestamp() });
      await b.commit();
    },
    approve: id => F.updateDoc(ref("slots", id), { status: "ok" }),
    async release(uid, mode, day, n, withPay) {
      const b = F.writeBatch(db);
      b.delete(ref("slots", mode + "_" + day + "_" + n));
      b.delete(ref("claims", mode + "_" + day + "_" + uid));
      if (withPay) b.delete(ref("payments", mode + "_" + day + "_" + uid));
      await b.commit();
    },
    async countVotes() {
      const out = {};
      await Promise.all(VOTES.map(async v => {
        const s = await F.getCountFromServer(F.query(F.collection(db, "votes"), F.where("choice", "==", v.k)));
        out[v.k] = s.data().count;
      }));
      return out;
    },
    async getMyVote(uid) { const s = await F.getDoc(ref("votes", uid)); return s.exists() ? s.data().choice : null; },
    vote: (uid, choice) => F.setDoc(ref("votes", uid), { choice, at: F.serverTimestamp() }),
    saveSettings: s => F.setDoc(ref("settings", "main"), s, { merge: true }),
    // Points tables live in the settings collection (pts_<lobby>_<date>): everyone reads, only the organizer writes.
    watchDoc: (id, cb, err) => F.onSnapshot(ref("settings", id), s => cb(s.exists() ? s.data() : null), err),
    savePoints: (id, data) => F.setDoc(ref("settings", id), data),
    async getSlots(days) { return list(await F.getDocs(F.query(F.collection(db, "slots"), F.where("day", "in", days)))); },
    async removeTeam(uid) {
      const b = F.writeBatch(db);
      b.delete(ref("teams", uid));
      for (const c of ["slots", "claims", "payments"]) {
        const snap = await F.getDocs(F.query(F.collection(db, c), F.where("uid", "==", uid)));
        snap.forEach(d => b.delete(d.ref));
      }
      await b.commit();
    },
    async resetSlots(mode, day) {
      const b = F.writeBatch(db);
      for (const c of ["slots", "claims", "payments"]) {
        const snap = await F.getDocs(F.query(F.collection(db, c), F.where("day", "==", day)));
        snap.forEach(d => { if (d.data().mode === mode) b.delete(d.ref); });
      }
      await b.commit();
    },
    async deleteMe(uid) {
      const b = F.writeBatch(db);
      for (const c of ["slots", "claims", "payments"]) {
        const snap = await F.getDocs(F.query(F.collection(db, c), F.where("uid", "==", uid)));
        snap.forEach(d => b.delete(d.ref));
      }
      b.delete(ref("votes", uid));
      b.delete(ref("teams", uid));
      await b.commit();
      try { await A.deleteUser(auth.currentUser); return "done"; }
      catch (e) {
        if (e && e.code === "auth/requires-recent-login") { await A.signOut(auth); return "relogin"; }
        throw e;
      }
    }
  };
}

    },
    async approve(id) { await wait(); if (st.slots[id]) st.slots[id].status = "ok"; fire(); },
    async release(uid, mode, d, n, withPay) { await wait(); delete st.slots[mode + "_" + d + "_" + n]; if (withPay) delete st.payments[mode + "_" + d + "_" + uid]; fire(); },
    async countVotes() { await wait(); const out = {}; VOTES.forEach(v => { out[v.k] = Object.values(st.votes).filter(x => x.choice === v.k).length; }); return out; },
    async getMyVote(uid) { return st.votes[uid] ? st.votes[uid].choice : null; },
    async vote(uid, choice) { await wait(); st.votes[uid] = { choice }; },
    async saveSettings(s) {
      await wait();
      const cur = st.settings || {}, lob = { ...(cur.lobbies || {}) };
      if (s.lobbies) for (const k in s.lobbies) lob[k] = { ...(lob[k] || {}), ...s.lobbies[k] };
      st.settings = { ...cur, ...s, lobbies: lob }; fire();
    },
    watchDoc: (id, cb) => watch(() => cb(st.docs[id] ? JSON.parse(JSON.stringify(st.docs[id])) : null)),
    async savePoints(id, data) { await wait(); st.docs[id] = JSON.parse(JSON.stringify(data)); fire(); },
    async getSlots(days) { await wait(); return list(st.slots).filter(s => days.includes(s.day)).map(s => ({ ...s })); },
    async removeTeam(uid) { await wait(); delete st.teams[uid]; for (const c of ["slots", "payments"]) for (const k in st[c]) if (st[c][k].uid === uid) delete st[c][k]; fire(); },
    async resetSlots(mode, d) { await wait(); for (const c of ["slots", "payments"]) for (const k in st[c]) { const s = st[c][k]; if (s.mode === mode && s.day === d) delete st[c][k]; } fire(); },
    async deleteMe(uid) { await wait(); delete st.teams[uid]; delete st.votes[uid]; for (const c of ["slots", "payments"]) for (const k in st[c]) if (st[c][k].uid === uid) delete st[c][k]; fire(); user = null; authCbs.forEach(cb => cb(null)); return "done"; }
  };
}

/* ---------- start ---------- */
async function boot() {
  renderNotices(); renderAll(); route();
  window.addEventListener("hashchange", route);
  try { S.api = DEMO ? demoBackend() : await firebaseBackend(); }
  catch (e) {
    console.error(e);
    S.fatal = "Could not connect. Check your internet connection and reload the page.";
    renderNotices();
    return;
  }
  S.api.watchSettings(s => { S.settings = normSettings(s); resubSlots(); resubLive(); S.regSig = ""; renderAll(); }, onErr);
  resubSlots();
  S.api.onAuth(onUser);
  setInterval(() => { if (S.slotKey && currentDays().join("|") !== S.slotKey) { resubSlots(); renderAll(); } }, 60000);
}
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
boot();
</script>
